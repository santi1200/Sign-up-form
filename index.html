<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>sign-up form</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

  
  <div class="left-side">
    <div class="logo">
       <img src="resources/odin-lined.png">
       <p>ODIN</p>
    </div>  
    <div id="photo-credits"><p>Photo by Halie West on Unsplash</p></div>
  </div>

  <div class="right-side">
    <div class="message">
       <p>
        This is not a real online service! You know you need something<br>
        like this in your life to help you realize your deepest dreams.<br>Sign up now to get started.
      </p>
       <p>You know you want to.</p>
    </div>

    <form action="#" method="post" id="sign-up">
        <p>Let's do this!<p>
        
        <div class="inputs">
          
         <div class="column">

          <label for="name">NAME</label>
          <input type="text" id="name">

           <label for="e-mail">EMAIL</label>
          <input type="email" id="e-mail">

           <label for="password">PASSWORD</label>
          <input type="password" id="password">
          
        
         </div>

         <div class="column">

          <label for="last-name">LAST NAME</label>
          <input type="text" id="last-name">

           <label for="p-number">PHONE NUMBER</label>
          <input type="tel" id="p-number">

           <label for="c-password">CONFIRM PASSWORD</label>
          <input type="password" id="c-password">
          
          
         </div>

        </div>

    </form>

    <div class="bottom">
      <button type="submit" form="sign-up">Create Account</button>
      <p >Already have an account? <a href="#" target="_blank">Log in</a></p>
    </div>

    
      
  </div>
    
   
   
    
  </body>
</html>
